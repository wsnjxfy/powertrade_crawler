[project]
name = "powertrade-crawler"
version = "0.1.0"
description = "Extensible crawlers for domestic and international electricity trading data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastembed==0.8.0",
    "onnxruntime==1.28.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.29",
    "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.4",
]
browser = [
    "playwright>=1.44.0",
]

[project.scripts]
powertrade = "powertrade_crawler.cli:app"

[tool.setuptools.package-data]
"powertrade_crawler.agent" = ["data/*.json"]
"powertrade_crawler.market_agent" = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
